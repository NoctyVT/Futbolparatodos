name: Actualizar partidos FPT

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar partidos.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 scripts/update_partidos.py

      - name: Publicar cambios si existen
        run: |
          if git diff --quiet -- partidos.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "FPT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add partidos.json
          git commit -m "Actualizar agenda de partidos"
          git push
